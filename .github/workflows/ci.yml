name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            telegram-bot/package-lock.json
            SillyTavern/package-lock.json

      - name: Verify frontend
        working-directory: web
        run: |
          npm ci
          npm run check

      - name: Verify Telegram companion
        working-directory: telegram-bot
        run: |
          npm ci
          npm run check

      - name: Verify SillyTavern extensions
        working-directory: SillyTavern
        run: |
          npm ci
          # .npmrc 默认 ignore-scripts=true，需要定向编译 better-sqlite3 原生模块
          npm rebuild better-sqlite3 --ignore-scripts=false
          npm run test:aibar
          npm run lint
