name: CI

on:
  push:
    # PR 分支由 pull_request 触发覆盖，push 只跑 main，避免同一提交双跑
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # 固定运行时 SHA 的唯一来源是 scripts/install-*.sh 里的 EXPECTED_COMMIT，
      # CI 从脚本中提取，避免同一 SHA 在 workflow 和脚本里维护两份拷贝。
      - name: Read pinned runtime SHAs from install scripts
        run: |
          set -Eeuo pipefail
          tavern_helper="$(sed -n "s/^readonly EXPECTED_COMMIT='\([0-9a-f]\{40\}\)'$/\1/p" scripts/install-tavern-helper.sh)"
          prompt_template="$(sed -n "s/^readonly EXPECTED_COMMIT='\([0-9a-f]\{40\}\)'$/\1/p" scripts/install-prompt-template.sh)"
          test -n "$tavern_helper"
          test -n "$prompt_template"
          printf 'TAVERN_HELPER_COMMIT=%s\n' "$tavern_helper" >> "$GITHUB_ENV"
          printf 'PROMPT_TEMPLATE_COMMIT=%s\n' "$prompt_template" >> "$GITHUB_ENV"

      - name: Checkout pinned TavernHelper runtime
        uses: actions/checkout@v5
        with:
          repository: N0VI028/JS-Slash-Runner
          ref: ${{ env.TAVERN_HELPER_COMMIT }}
          path: .vendor/tavern-helper

      - name: Checkout pinned Prompt Template runtime
        uses: actions/checkout@v5
        with:
          repository: zonde306/ST-Prompt-Template
          ref: ${{ env.PROMPT_TEMPLATE_COMMIT }}
          path: .vendor/prompt-template

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            telegram-bot/package-lock.json
            discord-import-service/package-lock.json
            SillyTavern/package-lock.json

      - name: Verify TavernHelper release provisioning
        run: |
          stage_dir="${RUNNER_TEMP}/tavern-helper-smoke"
          install -d -m 0755 "$stage_dir"
          scripts/install-tavern-helper.sh .vendor/tavern-helper "$stage_dir"

      - name: Verify Prompt Template release provisioning
        run: |
          stage_dir="${RUNNER_TEMP}/prompt-template-smoke"
          install -d -m 0755 "$stage_dir"
          scripts/install-prompt-template.sh .vendor/prompt-template "$stage_dir"

      - name: Verify frontend
        working-directory: web
        run: |
          npm ci
          npm run check

      - name: Verify Telegram companion
        working-directory: telegram-bot
        run: |
          npm ci
          npm run check

      - name: Verify local Discord import service
        working-directory: discord-import-service
        run: |
          npm ci
          npm run check

      # deploy/ 与 scripts/ 下的 bash 脚本只做语法校验，避免坏脚本进入发布链路
      - name: Syntax-check shell scripts
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' script; do
            if [[ "$script" == *.sh ]] || head -n 1 "$script" | grep -q 'bash'; then
              echo "bash -n $script"
              bash -n "$script"
            fi
          done < <(find deploy scripts -type f -print0)

      - name: Verify SillyTavern extensions
        working-directory: SillyTavern
        run: |
          npm ci
          # .npmrc 默认 ignore-scripts=true，需要定向编译 better-sqlite3 原生模块
          npm rebuild better-sqlite3 --ignore-scripts=false
          npm run test:aibar
          npm run lint

  deploy:
    name: Deploy production
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: aibar-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://aibar.peakstar88.store/aibar/
    env:
      DEPLOY_HOST: 172.86.116.166
      DEPLOY_USER: aibar-deploy
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # 与 verify job 相同：SHA 唯一来源是 scripts/install-*.sh
      - name: Read pinned runtime SHAs from install scripts
        run: |
          set -Eeuo pipefail
          tavern_helper="$(sed -n "s/^readonly EXPECTED_COMMIT='\([0-9a-f]\{40\}\)'$/\1/p" scripts/install-tavern-helper.sh)"
          prompt_template="$(sed -n "s/^readonly EXPECTED_COMMIT='\([0-9a-f]\{40\}\)'$/\1/p" scripts/install-prompt-template.sh)"
          test -n "$tavern_helper"
          test -n "$prompt_template"
          printf 'TAVERN_HELPER_COMMIT=%s\n' "$tavern_helper" >> "$GITHUB_ENV"
          printf 'PROMPT_TEMPLATE_COMMIT=%s\n' "$prompt_template" >> "$GITHUB_ENV"

      - name: Checkout pinned TavernHelper runtime
        uses: actions/checkout@v5
        with:
          repository: N0VI028/JS-Slash-Runner
          ref: ${{ env.TAVERN_HELPER_COMMIT }}
          path: .vendor/tavern-helper

      - name: Checkout pinned Prompt Template runtime
        uses: actions/checkout@v5
        with:
          repository: zonde306/ST-Prompt-Template
          ref: ${{ env.PROMPT_TEMPLATE_COMMIT }}
          path: .vendor/prompt-template

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 只需要 web/dist（下面 Package release 会 cp 进 stage），
      # build:install 往 SillyTavern/public/aibar 的拷贝不进 git archive 包，纯属弄脏子模块
      - name: Build production frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Package release
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail

          release_id="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::7}"
          stage_dir="${RUNNER_TEMP}/aibar-${release_id}"
          archive="${RUNNER_TEMP}/${release_id}.tar.gz"
          sillytavern_sha="$(git -C SillyTavern rev-parse HEAD)"

          install -d -m 0755 "$stage_dir"
          git -C SillyTavern archive --format=tar HEAD | tar -xf - -C "$stage_dir"
          install -d -m 0755 "$stage_dir/public"
          cp -R web/dist "$stage_dir/public/aibar"
          scripts/install-tavern-helper.sh .vendor/tavern-helper "$stage_dir"
          scripts/install-prompt-template.sh .vendor/prompt-template "$stage_dir"

          {
            printf 'main_sha=%s\n' "$GITHUB_SHA"
            printf 'sillytavern_sha=%s\n' "$sillytavern_sha"
            printf 'tavern_helper_sha=%s\n' "$TAVERN_HELPER_COMMIT"
            printf 'prompt_template_sha=%s\n' "$PROMPT_TEMPLATE_COMMIT"
            printf 'built_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'github_run=%s/actions/runs/%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$stage_dir/.aibar-release"

          tar -czf "$archive" -C "$stage_dir" .
          archive_sha="$(sha256sum "$archive" | cut -d ' ' -f 1)"

          printf 'release_id=%s\n' "$release_id" >> "$GITHUB_OUTPUT"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'archive_sha=%s\n' "$archive_sha" >> "$GITHUB_OUTPUT"

      - name: Configure deployment SSH key
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.AIBAR_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.AIBAR_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/aibar_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/aibar_deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/aibar_deploy" >/dev/null

      - name: Upload and activate release
        shell: bash
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          ARCHIVE: ${{ steps.release.outputs.archive }}
          ARCHIVE_SHA: ${{ steps.release.outputs.archive_sha }}
        run: |
          set -Eeuo pipefail

          sftp \
            -i "$HOME/.ssh/aibar_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -b - "$DEPLOY_USER@$DEPLOY_HOST" <<SFTP
          put $ARCHIVE $RELEASE_ID.tar.gz
          SFTP

          ssh \
            -T \
            -i "$HOME/.ssh/aibar_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy $RELEASE_ID $ARCHIVE_SHA"

      - name: Verify public endpoint
        run: |
          # SPA 首页 + 后端 API 各探一次：只探首页时后端起不来也会被判为部署成功
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 5 \
            https://aibar.peakstar88.store/aibar/ \
            >/dev/null
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 5 \
            https://aibar.peakstar88.store/csrf-token \
            >/dev/null

      - name: Remove deployment key
        if: always()
        run: rm -f "$HOME/.ssh/aibar_deploy"
